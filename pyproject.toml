[project]
name = "stateweaver"
version = "0.1.0"
description = "StateWeaver collaborative video production studio"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pillow>=11,<12",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai]==1.99.0",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
stateweaver = "stateweaver.studio.v2_cli:main"
stateweaver-db = "stateweaver.db_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/stateweaver"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stateweaver"]
mypy_path = "apps/api/src"
